<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CSS</title>
    <style>
        h2 {
            color: rgb(18, 18, 255);
        }
        p {
            color: rgb(18, 255, 18);
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">   
</head>
<body>
    <h1>Maneras de incluir estilos CSS en un archivo html</h1>
    <h1 style="color: rgb(255, 18, 18);">Hello world con css - Tipo Inline</h1>

    <h2>Estilo css - Tipo Interno</h2>
    <p> Esta es la manera de incluir estilos tipo interno, colocando los estilos en el head del HTML </p>
    <h3>Estilo css - Tipo Externo</h3>
    <a> Se incluyo estilos a través de un archivo externo </a>

</body>
</html>
