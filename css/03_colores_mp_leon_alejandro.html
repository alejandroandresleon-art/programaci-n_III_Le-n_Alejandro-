<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores - Inmobiliaria</title>
    <style>
        body {
            background-color: rgb(240, 244, 248); 
        }
        h1 {
            color: darkblue; 
        }
        h2 {
            color: #0056b3; 
        }
        h3 {
            color: rgb(0, 86, 179);
        }
        h4 {
            color: rgba(0, 86, 179, 0.8); 
        }
        h5 {
            color: hsl(210, 100%, 35%); 
        }
        h6 {
            color: #2c3e50; 
        }
    </style>
</head>
<body>
    <h1>Maneras de establecer colores en Inmobiliaria Vista Real</h1>
    <h2>Por nombre del color (Sección Residencial)</h2>
    <h3>Hexadecimal (Precios y Tarifas)</h3>
    <h4>RGB (Características del Inmueble)</h4>
    <h5>RGBA (Notas y Avisos Importantes)</h5>
    <h6>HSL (Pie de página / Términos)</h6>
    
</body>
</html>
