<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            background-color: rgb(18, 18, 255);
        }
        h1 {
            color: red;
        }
        h2 {
            color: #Ff0000;
        }
        h3 {
            color: rgb(255, 0, 0);
        }
        h4 {
            color: rgba(255, 0, 0, 0.8);
        }
        h5 {
            color: hsl(0, 100%, 50%);
        }

    </style>
</head>
<body>
    <h1>Maneras de establecer colores</h1>
    <h2>Por nombre del color</h2>
    <h3>Hexadecimal</h3>
    <h4>RGB</h4>
    <h5>RGBA</h5>
    <h6>HSL</h6>
    
</body>
</html>
