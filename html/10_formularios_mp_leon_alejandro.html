<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Inmobiliaria</title>
</head>
<body>
    <form action="/registro" method="post">
        <table>
            <tr>
                <td><label for="nombre">Nombre:</label></td>
                <td><input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre"></td>
                <td><label for="apellido">Apellido:</label></td>
                <td><input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido"></td>
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password" placeholder="Ingrese su password"></td>
                <td><label for="password_confirm">Confirmar Password:</label></td>
                <td><input type="password" id="password_confirm" name="password_confirm" placeholder="Confirme su password"></td>
            </tr>
            <tr>
                <td><label for="edad">Edad:</label></td>
                <td><input type="number" id="edad" name="edad" placeholder="Ingrese su edad"></td>
                <td>
                    <label for="nivel">Nivel de presupuesto (USD en miles)</label><br>
                    <input type="number" id="nivel" name="nivel" min="50" max="500" value="150" step="10">
                </td>
                <td>
                    <p>Seleccionar tipo de cliente</p>
                    <input type="radio" id="comprador" name="bando" value="comprador">
                    <label for="comprador">Comprador</label>
                    <input type="radio" id="arrendatario" name="bando" value="arrendatario">
                    <label for="arrendatario">Arrendatario</label>
                </td>
                <td>
                    <p>Seleccione comodidades deseadas</p><br>
                    <input
                    type="checkbox"
                    id="piscina"
                    name="habilidades"
                    value="piscina"
                    >
                    <label for="piscina">Piscina propia</label><br>
                    <input
                    type="checkbox"
                    id="estacionamiento"
                    name="habilidades"
                    value="estacionamiento"
                >
                <label for="estacionamiento">Estacionamiento techado</label>
                </td>   
            </tr>   
            <tr>
                <td>
                    <label for="planeta">Zona de Preferencia</label>
                    <select id="planeta" name="planeta" required>
                        <option value="">Seleccione una zona</option>
                        <option value="Norte">Sector Norte</option>
                        <option value="Sur">Sector Sur</option>
                        <option value="Centro">Zona Financiera</option>
                    </select>
                </td>
                <td>
                    <label for="droide">Amenidades adicionales</label>
                    <select id="droide" name="droide" multiple size="2">
                        <option value="">Seleccione amenidades</option>
                        <option value="Gimnasio">Gimnasio</option>
                        <option value="Seguridad">Seguridad 24/7</option>
                        <option value="Terraza">Terraza panorámica</option>
                    </select>
                </td>
            </tr>
            <tr>
            <td>
                <fieldset>
                    <legend>Datos de Búsqueda</legend>
                    <label for="misiones">Tipo de Propiedad:</label>
                    <input type="text" id="misiones" name="misiones" placeholder="Ej. Apartamento, Casa">
                    <br>
                    <label for="vuelos">Habitaciones:</label> 
                    <input type="number" id="vuelos" name="vuelos">
                </fieldset>
            </td>    
            </tr>
                
        </table>
        <button type="submit">Enviar</button>
        <button type="reset">Reset</button>
    </form>
    
</body>
</html>
